<title>Freedom Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a ledger book in ink, paper and French grey. Big expanded numerals carry the page; everything else is quiet rows. */
:root{
  --paper:#F4F4F1; --surface:#FFFFFF; --ink:#131416; --ink-2:#5A5D61; --ink-3:#8A8D90;
  --grey:#B9BBBC; --line:#DFE0DD; --fill:#ECECE8; --brass:#7C6A43;
  --pos:#2D6A4C; --neg:#A23F2D; --warn:#946414;
  --pos-bg:rgba(45,106,76,.10); --neg-bg:rgba(162,63,45,.10); --warn-bg:rgba(148,100,20,.12);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E0F10; --surface:#16171A; --ink:#ECECE9; --ink-2:#A2A4A7; --ink-3:#74777B;
  --grey:#55585C; --line:#26282B; --fill:#1E2023; --brass:#C9B17E;
  --pos:#74C29A; --neg:#E58B76; --warn:#DDB062;
  --pos-bg:rgba(116,194,154,.12); --neg-bg:rgba(229,139,118,.12); --warn-bg:rgba(221,176,98,.13);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E0F10; --surface:#16171A; --ink:#ECECE9; --ink-2:#A2A4A7; --ink-3:#74777B;
  --grey:#55585C; --line:#26282B; --fill:#1E2023; --brass:#C9B17E;
  --pos:#74C29A; --neg:#E58B76; --warn:#DDB062;
  --pos-bg:rgba(116,194,154,.12); --neg-bg:rgba(229,139,118,.12); --warn-bg:rgba(221,176,98,.13);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.muted{color:var(--ink-2)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}

/* Header */
header.top{padding-block:20px 6px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:10px}
.mark h1{font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:800;font-size:20px;letter-spacing:-.01em}
.mark .rule{width:28px;height:2px;background:var(--ink);align-self:center}
.mark .sub{font-size:12.5px;color:var(--ink-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--grey)}
.chip.pay .dot{background:var(--pos)}
.chip.save-state .dot{background:var(--grey)}
.chip.save-state[data-s="saved"] .dot{background:var(--pos)}
.chip.save-state[data-s="err"] .dot{background:var(--neg)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-top:10px}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:12px 12px 11px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

main{padding-block:22px 64px}
section.view{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
section.view > *, [data-dyn]{min-width:0}
[data-dyn]{grid-template-columns:minmax(0,1fr)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--grey);border-radius:var(--r);padding:12px 14px;background:var(--fill);font-size:13.5px}
.banner b{font-weight:700}

/* Buttons & inputs */
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.x{border:0;background:none;color:var(--ink-3);font-size:13px;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--neg);background:var(--neg-bg)}
.x.armed{color:var(--neg);background:var(--neg-bg);font-weight:600}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.field:focus{outline:none;border-color:var(--ink)}
.inline{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;margin:-3px -6px;min-width:0;width:100%}
.inline:hover{border-color:var(--line)}
.inline:focus{outline:none;border-color:var(--ink);background:var(--surface)}
.inline.num{text-align:right}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:28px;align-items:end}
.big{font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:clamp(46px,9vw,86px);line-height:.92;letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin-top:8px}
.big .cents{font-size:.42em;letter-spacing:-.01em;color:var(--ink-3);font-weight:600}
.delta{display:inline-flex;gap:6px;align-items:center;margin-top:12px;font-size:13.5px;padding:3px 9px;border-radius:999px}
.delta.up{background:var(--pos-bg);color:var(--pos)} .delta.down{background:var(--neg-bg);color:var(--neg)} .delta.flat{background:var(--fill);color:var(--ink-2)}
.chart{width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
.empty{color:var(--ink-2);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center}

.split{display:grid;gap:8px}
.split-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--fill);gap:2px}
.split-bar span{display:block;height:100%}
.split-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.split-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.sw-cash{background:var(--grey)} .sw-inv{background:var(--ink)} .sw-debt{background:var(--neg)}

/* Stat strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.stat{padding:14px 16px 16px 0;display:grid;gap:4px;align-content:start;min-width:0}
.stat+.stat{padding-left:16px;border-left:1px solid var(--line)}
.stat .v{font-family:var(--display);font-variation-settings:"wdth" 112;font-weight:700;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .s{font-size:12.5px;color:var(--ink-2)}

/* Section heads */
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sh h2{font-family:var(--display);font-variation-settings:"wdth" 110;font-weight:750;font-size:19px;letter-spacing:-.01em}
.sh .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Ledger rows */
.ledger{border-top:1px solid var(--line)}
.row{display:grid;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.acct{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 92px minmax(0,1.1fr) 28px}
.acct .nm{display:grid;gap:1px;min-width:0}
.acct .nm input{font-weight:600}
.acct .inst{font-size:12px;color:var(--ink-3)}
.acct .bal{font-family:var(--mono);font-size:17px;font-weight:600}
.acct .meta{font-size:12px;color:var(--ink-3);text-align:right}
.acct select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:12.5px;width:100%}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink-2);white-space:nowrap}

/* Claude read */
.read{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.read-out{white-space:pre-wrap;font-size:14.5px;line-height:1.6;max-width:72ch}
.read-out.thinking{color:var(--ink-3)}
.read .foot{font-size:12px;color:var(--ink-3)}

/* Month */
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav h2{min-width:9.5em;text-align:center}
.allow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:18px 20px}
.allow .big2{font-family:var(--display);font-variation-settings:"wdth" 120;font-weight:800;font-size:clamp(36px,6vw,54px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.allow .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:600}
.allow .side{text-align:right;font-size:13px;opacity:.85;display:grid;gap:3px}

.add{display:grid;grid-template-columns:auto minmax(0,120px) minmax(0,1fr) minmax(0,1.2fr) 140px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.add .amt{font-family:var(--mono);font-size:16px;font-weight:600}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
.bud{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 100px 24px}
.bud .bn{display:flex;align-items:center;gap:8px;min-width:0}
.bud .bn input{font-weight:600}
.bar{height:6px;background:var(--fill);border-radius:999px;overflow:hidden;position:relative}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:999px}
.bar.near span{background:var(--warn)} .bar.over span{background:var(--neg)}
.bud .figs{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:5px;display:flex;justify-content:space-between;gap:6px}
.bud .budget{font-family:var(--mono);font-size:13.5px}
.fix{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

.txday{font-size:12px;color:var(--ink-3);padding:14px 0 4px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tx{grid-template-columns:minmax(0,1fr) auto auto 26px;padding:8px 0}
.tx .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .cat{font-size:12px;color:var(--ink-2);background:var(--fill);border-radius:4px;padding:2px 7px;white-space:nowrap}
.tx .a{font-family:var(--mono);font-weight:600;text-align:right;min-width:84px}

/* Goals */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.goal{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start}
.goal .gh{display:flex;justify-content:space-between;gap:8px;align-items:start}
.goal .gh input{font-family:var(--display);font-variation-settings:"wdth" 110;font-weight:750;font-size:17px}
.goal .gv{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.goal .gv .cur{font-family:var(--display);font-variation-settings:"wdth" 115;font-weight:800;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.goal .gv .of{color:var(--ink-3);font-family:var(--mono);font-size:13px}
.goal .bar{height:8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13px;align-items:center}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-family:var(--mono)}
.kv dd input{text-align:right;font-family:var(--mono)}
.need{font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.contrib{display:flex;gap:6px}
.contrib input{font-family:var(--mono)}
.newgoal{border:1px dashed var(--grey);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}

/* Future */
.proj-ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ctl{display:grid;gap:6px}
.ctl label{font-size:12px;color:var(--ink-2);font-weight:600}
.ctl .field{font-family:var(--mono)}
input[type=range]{width:100%;accent-color:var(--ink)}
.miles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--ink)}
.mile{padding:12px 10px 4px 0;display:grid;gap:2px;min-width:0}
.mile+.mile{padding-left:10px;border-left:1px solid var(--line)}
.mile .age{font-size:12px;color:var(--ink-2)}
.mile .val{font-family:var(--mono);font-weight:600;font-size:15px}
.freedom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px}
.freedom .fv{font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:clamp(28px,4.5vw,40px);letter-spacing:-.02em;color:var(--brass);font-variant-numeric:tabular-nums}
.real{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:start}
.real-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.real-out div{border-left:2px solid var(--ink);padding-left:12px}
.real-out .v{font-family:var(--mono);font-weight:600;font-size:20px}
.real-out .s{font-size:12px;color:var(--ink-2)}
.settings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.note-sm{font-size:12px;color:var(--ink-3)}

/* Debt */
.dwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dtable{min-width:760px}
.debt{grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) 76px minmax(0,1fr) minmax(0,1.1fr) 92px minmax(0,1fr)}
.debt > span:nth-child(n+2){text-align:right}
.debt .num{font-family:var(--mono)}
.debt.head{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 0}
.extra{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--ink)}
.cmp-col{padding:14px 18px 6px 0;display:grid;gap:8px;align-content:start}
.cmp-col+.cmp-col{padding-left:18px;border-left:1px solid var(--line)}
.cmp-v{font-family:var(--display);font-variation-settings:"wdth" 115;font-weight:800;font-size:28px;letter-spacing:-.02em}
@media (max-width:820px){ .extra,.cmp{grid-template-columns:1fr} .cmp-col+.cmp-col{padding-left:0;border-left:0;border-top:1px solid var(--line)} }

.plan{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:13.5px}
.plan .op{color:var(--ink-3)}
.plan .note-sm{flex-basis:100%}
.plan.over{border-color:var(--neg);background:var(--neg-bg)}
.qfrom{display:grid;gap:6px}
/* Accounts as grouped cards */
.agroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.agroup{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.ag-head{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--fill)}
.ag-head .mono{font-weight:600;font-size:13.5px}
.acard+.acard{border-top:1px solid var(--line)}
.ac-main{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px}
.ac-name{all:unset;cursor:pointer;display:grid;gap:1px;min-width:0;flex:1}
.ac-name b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-name span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-name:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.ac-bal{display:grid;justify-items:end;gap:1px;flex:0 0 auto;width:9.5em}
.ac-bal .bal{font-family:var(--mono);font-size:16px;font-weight:600}
.ac-bal .meta{font-size:11.5px;color:var(--ink-3)}
.acard.open{background:var(--paper)}
.ac-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:4px 14px 14px}
.ac-edit label{display:grid;gap:4px;font-size:12px;color:var(--ink-2);font-weight:600}
.ac-edit .field{font-weight:400;color:var(--ink)}
.ac-actions{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center}

/* App shell: bottom bar, + button, sheet */
.bnav{display:none}
.fab{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:8}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.fab:active{transform:scale(.96)}
body.sheet-on{overflow:hidden}
[hidden]{display:none!important}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(10,10,12,.45);display:grid;place-items:center;padding:16px}
.sheet{width:min(460px,100%);background:var(--surface);color:var(--ink);border-radius:16px;padding:16px 18px 18px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.grab{display:none}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.q-amt-wrap{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.q-amt-wrap span{font-family:var(--display);font-weight:800;font-size:34px;color:var(--ink-3)}
.q-amt-wrap input{border:0;background:transparent;outline:none;width:100%;font-family:var(--display);font-variation-settings:"wdth" 115;font-weight:800;font-size:44px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);padding:0}
.qcats{display:flex;flex-wrap:wrap;gap:7px;max-height:168px;overflow-y:auto}
.qcat{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.qcat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.q-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px}
.q-go{padding:13px;font-size:15px}

@media (max-width:640px){
  nav.tabs{display:none}
  header.top{padding-block:14px 8px}
  .mark .sub{display:none}
  .chips .chip{font-size:12px;padding:4px 9px}
  .top-row .chips{flex-wrap:nowrap;min-width:0;max-width:100%}
  #save-chip{padding:9px;flex:0 0 auto}
  #save-chip span:last-child{display:none}
  #pay-chip{min-width:0;overflow:hidden}
  #pay-chip span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding-block:12px calc(150px + env(safe-area-inset-bottom,0px))}

    const step = st.payFreq === "weekly" ? 7 : 14; const a = parseD(st.payAnchor || todayS());

    while (d <= end) { push(new Date(d)); d.setDate(d.getDate() + step); }

/* Debt payoff, paycheck by paycheck. mode "split" = each debt gets its own payment; "rate" = all money to the highest rate first. Paid-off payments roll forward. */
function simulate(mode, extra) {

  const ds = S.core.accounts.filter(a => a.kind === "debt" && Math.abs(Number(a.balance)||0) > 0.005)
    .map(a => ({id:a.id, name:a.name, bal:Math.abs(Number(a.balance)||0), apr:Number(a.apr)||0, pay:Number(a.pay)||0, bp:Number(a.bonusPay)||0, int:0, off:null}));
  const res = {debts: ds, free: null, interest: 0, series: [], start: ds.reduce((s,d)=>s+d.bal,0)};
  if (!ds.length) return res;
  const today = parseD(todayS()); let last = today, lastM = -1;
  res.series.push({d: today, v: res.start});
  for (const c of paychecks(today, 40)) {
    const days = (c.d - last) / 864e5; last = c.d;
    ds.forEach(d => { if (d.bal > 0 && d.apr > 0) { const i = d.bal * d.apr / 100 / 365 * days; d.bal += i; d.int += i; } });
    let pool = (Number(extra)||0) + ds.reduce((s, d) => s + d.pay + (c.bonus ? d.bp : 0), 0);
    if (pool <= 0) break;
    if (mode === "split") ds.forEach(d => { if (d.bal > 0) { const p = Math.min(d.bal, d.pay + (c.bonus ? d.bp : 0)); d.bal -= p; pool -= p; } });
    ds.filter(d => d.bal > 0).sort((a, b) => b.apr - a.apr || a.bal - b.bal).forEach(d => { const p = Math.min(d.bal, pool); d.bal -= p; pool -= p; });
    ds.forEach(d => { if (d.bal <= 0.005 && !d.off) { d.bal = 0; d.off = c.d; } });
    const total = ds.reduce((s, d) => s + d.bal, 0);
    if (c.d.getMonth() !== lastM) { res.series.push({d: c.d, v: total}); lastM = c.d.getMonth(); }
    if (total <= 0.005) { res.free = c.d; res.series.push({d: c.d, v: 0}); break; }

}
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th","st","nd","rd"][n % 10] || "th");

/* ---------- mutations ---------- */
function touchSnapshot() {
  const d = todayS(), t = totals().net;
  const snaps = S.core.snapshots; const last = snaps[snaps.length - 1];
  if (last && last.d === d) last.t = t; else snaps.push({d, t});
  snaps.sort((a, b) => a.d < b.d ? -1 : 1);
}
/* Logging moves money. Spending comes out of the "paid from" account; a debt or savings

   Each transaction remembers its exact moves, so deleting it puts every balance back. */
const r2 = n => Math.round(n * 100) / 100;
const defaultAcct = () => (S.core.accounts.find(a => a.id === "wfc") || S.core.accounts.find(a => a.kind === "cash") || {}).id || "";
function txMoves(tx) {
  if (S.core.settings.autoBalances === false) return [];
  const amt = Number(tx.amt) || 0, moves = [];
  const src = tx.acct && S.core.accounts.find(a => a.id === tx.acct);
  if (tx.type === "in") { if (src) moves.push([src.id, amt]); return moves; }
  if (src) moves.push([src.id, src.kind === "debt" ? amt : -amt]);
  const cat = S.core.cats.find(c => c.id === tx.cat);
  const link = cat && cat.acct && S.core.accounts.find(a => a.id === cat.acct);
  if (link && (!src || link.id !== src.id)) moves.push([link.id, link.kind === "debt" ? -amt : amt]);
  return moves;
}
function applyToAccount(tx, dir) {
  let moves = dir > 0 ? txMoves(tx) : tx.moves;
  if (dir < 0 && !moves && tx.applied) { const a = S.core.accounts.find(x => x.id === tx.applied); moves = a ? [[a.id, a.kind === "debt" ? -tx.amt : tx.amt]] : []; }
  if (!moves || !moves.length) return "";
  const touched = [];
  moves.forEach(([id, delta]) => { const a = S.core.accounts.find(x => x.id === id); if (!a) return;
    a.balance = r2((Number(a.balance)||0) + dir * delta); a.updated = todayS(); touched.push(a); });
  if (dir > 0) { tx.moves = moves; tx.applied = true; }
  touchSnapshot();
  return touched.map(a => `${a.name} ${money2(a.balance)}`).join(" · ");
}
/* Keeping linked numbers in step */
function checksPerMonth() {
  const st = S.core.settings;
  return st.payFreq === "weekly" ? 52/12 : st.payFreq === "biweekly" ? 26/12 : st.payFreq === "monthly" ? 1 : Math.max(1, (st.payDays || [15,31]).length);
}
function syncDebtCat(acct) { // per-paycheck payment changed → that debt's monthly budget line follows
  S.core.cats.forEach(c => { if (c.acct === acct.id && catKind(c) === "debt") c.budget = r2((Number(acct.pay)||0) * checksPerMonth()); });
}
function syncDebtPay(cat) { // monthly budget line changed → per-paycheck payment follows
  const a = cat.acct && S.core.accounts.find(x => x.id === cat.acct);
  if (a && a.kind === "debt" && catKind(cat) === "debt") a.pay = r2((Number(cat.budget)||0) / checksPerMonth());
}
const goalTarget = g => g.autoMonths ? Math.round(budgetTotal() * Number(g.autoMonths) / 100) * 100 : Number(g.target) || 0;
const monthlyTakeHome = () => (Number(S.core.settings.payNet)||0) * checksPerMonth();

function nwChart(el) {
  const snaps = S.core.snapshots.slice().sort((a,b) => a.d < b.d ? -1 : 1);
  if (snaps.length < 2) { el.innerHTML = `<div class="empty">Your net worth line starts once you've updated balances on two different days.</div>`; return; }
  const W = Math.max(280, el.clientWidth || 600), H = Math.round(Math.min(220, Math.max(150, W * 0.36)));
  const L = 6, R = 64, T = 14, B = 24;
  const xs = snaps.map(s => parseD(s.d).getTime()), ys = snaps.map(s => s.t);
  const x0 = xs[0], x1 = xs[xs.length-1] === x0 ? x0 + 1 : xs[xs.length-1];
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const padY = (y1 - y0) * 0.15 || Math.abs(y1) * 0.1 || 100; y0 -= padY; y1 += padY;
  const sx = v => L + (v - x0) / (x1 - x0) * (W - L - R), sy = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const pts = snaps.map((s, i) => [sx(xs[i]), sy(s.t)]);

  const ticks = [0, .5, 1].map(f => y0 + padY + f * (y1 - y0 - 2*padY));
  const grid = ticks.map(v => `<line x1="${L}" x2="${W-R+8}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${W-R+14}" y="${(sy(v)+3.5).toFixed(1)}">${compact(v)}</text>`).join("");
  const last = pts[pts.length-1];

    <text x="${L}" y="${H-6}">${shortDate(snaps[0].d)}</text>

}
function projChart(el, pts, age, freedomNum) {

async function saveLocalFile(filename, text, mime) {
  try {
    const file = new File([text], filename, {type: mime});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: filename}); return true; }
  } catch (e) { if (e && e.name === "AbortError") return false; }
  try {
    const url = URL.createObjectURL(new Blob([text], {type: mime}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
  } catch (e) { toast("Couldn't save the file here."); return false; }
}

      <p class="muted" style="margin:12px 0 0;max-width:46ch">${plan.free ? `On your current plan you'll pay about <b class="mono">${money(plan.interest)}</b> more in interest before it's gone.` : "Raise a payment or check the APRs below."}</p>

  ${assumed.length ? `<div class="banner"><span><b>${assumed.map(a => esc(a.name)).join(", ")}: APR is a placeholder (${assumed.map(a => a.apr + "%").join(", ")}).</b> Put in your real rate from the card statement. It moves the debt-free date more than anything else here.</span></div>` : ""}

    <div data-dyn class="note-sm" style="font-size:13.5px">${extra ? `<b class="mono">+${money(extra)}</b> a check to the highest-rate debt ` + (base.free && plan.free ? `gets you debt-free <b>${monthsBetween(plan.free, base.free)} month${monthsBetween(plan.free, base.free)===1?"":"s"} sooner</b> and saves <b class="mono">${money(base.interest - plan.interest)}</b> in interest.` : "") : "Drag to see what an extra $50 or $100 a check would do."}</div>

        return `<div class="row debt" data-acct="${a.id}" role="row">
          <span class="dname"><input class="inline" id="dn-${a.id}" data-f="name" value="${esc(a.name)}" aria-label="Debt name" style="font-weight:600"></span>

function debtChart(el) {
  if (!el) return;
  const st = S.core.settings, extra = Number(st.extraDebt)||0;
  const plan = simulate("split", extra), alt = simulate("rate", extra);
  if (plan.series.length < 2) { el.innerHTML = ""; return; }
  const W = Math.max(280, el.clientWidth || 600), H = Math.round(Math.min(220, Math.max(150, W * 0.36)));
  const L = 6, R = 64, T = 14, B = 24;
  const all = plan.series.concat(alt.series);
  const x0 = plan.series[0].d.getTime(), x1 = Math.max(...all.map(p => p.d.getTime()), x0 + 864e5);
  const yMax = Math.max(...all.map(p => p.v)) * 1.08 || 1;
  const sx = t => L + (t - x0) / (x1 - x0) * (W - L - R), sy = v => T + (1 - v / yMax) * (H - T - B);
  const path = s => s.map((p, i) => (i ? "L" : "M") + sx(p.d.getTime()).toFixed(1) + " " + sy(p.v).toFixed(1)).join(" ");
  const lp = path(plan.series);
  const area = lp + ` L${sx(plan.series[plan.series.length-1].d.getTime()).toFixed(1)} ${H-B} L${sx(x0).toFixed(1)} ${H-B} Z`;
  const ticks = [yMax/1.08, yMax/1.08/2];
  const end = plan.series[plan.series.length-1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Total debt falling from ${money(plan.start)} to zero by ${monYr(plan.free)}">
    ${ticks.map(v => `<line x1="${L}" x2="${W-R+8}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}" stroke="var(--line)"/><text x="${W-R+14}" y="${(sy(v)+3.5).toFixed(1)}">${compact(v)}</text>`).join("")}
    <line x1="${L}" x2="${W-R+8}" y1="${H-B}" y2="${H-B}" stroke="var(--grey)"/>
    <path d="${area}" fill="var(--neg)" fill-opacity=".08"/>
    ${S.core.accounts.filter(a => a.kind === "debt").length > 1 ? `<path d="${path(alt.series)}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="4 4"/>` : ""}
    <path d="${lp}" fill="none" stroke="var(--neg)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${sx(end.d.getTime()).toFixed(1)}" cy="${sy(end.v).toFixed(1)}" r="4.5" fill="var(--pos)"/>
    <text x="${L}" y="${H-6}">Today</text>
    <text x="${sx(end.d.getTime()).toFixed(1)}" y="${H-6}" text-anchor="end">${plan.free ? monYr(plan.free) : ""}</text>
  </svg>`;
}

function viewFuture() {
  const st = S.core.settings, t = totals();
  const age = Number(st.age)||22, ret = Number(st.ret)||0, monthly = Number(st.monthly)||0, retireAge = Math.max(age+1, Number(st.retireAge)||60);
  const years = retireAge - age;
  const pts = project(t.inv, monthly, ret, years);
  const annual = budgetTotal() * 12, freedomNum = annual * 25;
  // when does it cross the freedom number (search up to age 80)
  const far = project(t.inv, monthly, ret, Math.max(years, 80 - age));
  let crossAge = null; const rm = Math.pow(1+ret/100,1/12)-1; { let v = t.inv; for (let m = 1; m <= (80-age)*12; m++) { v = v*(1+rm)+monthly; if (v >= freedomNum) { crossAge = age + m/12; break; } } }
  const miles = [25,30,35,40,50,60].filter(a => a > age).slice(0,6);
  while (miles.length < 6) miles.push((miles[miles.length-1]||age) + 5);
  const valAt = a => { const p = far.find(x => x.y === a - age); return p ? p.v : 0; };
  const price = Number(st.realPrice)||0;
  const fv = a => price * Math.pow(1 + ret/100, a - age);
  const hrs = Number(st.hourly) > 0 ? price / Number(st.hourly) : null;
  const end = pts[pts.length-1];
  return `
  <div>
    <div class="sh"><h2>Future you</h2><span class="note-sm">Starts from what's invested today (${money(t.inv)}). Returns are assumptions, not promises.</span></div>

}

/* ---------- render ---------- */
function render() {
  const app = $("#app");
  document.querySelectorAll("nav.tabs button, nav.bnav button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
  $("#today-label").textContent = new Date().toLocaleDateString("en-US", {weekday:"long", month:"long", day:"numeric"});
  const pd = nextPayday(), pc = $("#pay-chip");
  if (pd) { const n = Math.round((pd.d - parseD(todayS())) / 864e5); pc.hidden = false; pc.lastElementChild.textContent = (n === 0 ? "Payday today" : `Payday in ${n} day${n===1?"":"s"} · ${pd.d.toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric"})}`) + (pd.bonus ? " · bonus check" : ""); }
  else pc.hidden = true;
  const v = ui.tab;
  app.innerHTML = `<section class="view" data-view="${v}">${v === "overview" ? viewOverview() : v === "month" ? viewMonth() : v === "debt" ? viewDebt() : v === "goals" ? viewGoals() : viewFuture()}</section>`;
  if (v === "overview") nwChart($("#nw-chart"));
  if (v === "debt") debtChart($("#debt-chart"));
  if (v === "future") drawProj();
}
function drawProj() {
  const st = S.core.settings, age = Number(st.age)||22, years = Math.max(1, (Number(st.retireAge)||60) - age);
  projChart($("#proj-chart"), project(totals().inv, Number(st.monthly)||0, Number(st.ret)||0, years), age, budgetTotal()*12*25);
}
function drawFutureDyn() {
  const host = $("#future-dyn"); if (!host) return;
  const tmp = document.createElement("div"); tmp.innerHTML = viewFuture();
  const fresh = tmp.querySelector("#future-dyn"); if (fresh) host.innerHTML = fresh.innerHTML;
  drawProj();
}

/* ---------- events ---------- */
function setTab(t) { ui.tab = t; ui.armed = null; try { history.replaceState(null, "", "#" + t); } catch (e) {} render(); window.scrollTo({top:0}); }
document.querySelectorAll("nav.tabs, nav.bnav").forEach(n => n.addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); }));

/* Quick-log sheet */
const acctChoices = (type = ui.draft.type) => S.core.accounts.filter(a => a.kind === "cash" || (type !== "in" && a.kind === "debt" && Number(a.apr) > 0)).map(a => [a.id, a.name]).concat([["", "Don't move money"]]);
const defaultCat = () => (S.core.cats.find(c => c.id === "groc") || S.core.cats.find(c => catKind(c) === "spend") || S.core.cats[0] || {id:"other"}).id;
function renderSheet() {
  const el = $("#sheet"), dr = ui.draft;
  const cats = dr.type === "in" ? INCOME_CATS : S.core.cats;
  if (!cats.some(c => c.id === dr.cat)) dr.cat = cats[0] ? cats[0].id : "";
  el.innerHTML = `<form class="sheet" id="sheet-form" autocomplete="off" role="dialog" aria-modal="true" aria-label="Log a transaction">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-top"><div class="seg" role="group" aria-label="Type"><button type="button" data-act="q-type" data-v="out" aria-pressed="${dr.type==="out"}">Spent</button><button type="button" data-act="q-type" data-v="in" aria-pressed="${dr.type==="in"}">Earned</button></div><button type="button" class="x" data-act="sheet-close" aria-label="Close">✕</button></div>
    <label class="q-amt-wrap"><span>$</span><input id="q-amt" inputmode="decimal" placeholder="0.00" value="${esc(dr.amt)}" aria-label="Amount"></label>
    <div class="qcats">${cats.map(c => `<button type="button" class="qcat" data-act="q-cat" data-id="${c.id}" aria-pressed="${c.id===dr.cat}">${esc(c.name.replace(/\s*\(.*\)$/, ""))}</button>`).join("")}</div>
    ${S.core.settings.autoBalances === false ? "" : `<div class="qfrom"><span class="label">${dr.type === "in" ? "Goes into" : "Paid from"}</span><div class="qcats">${acctChoices().map(([id, name]) => `<button type="button" class="qcat qacct" data-act="q-acct" data-id="${id}" aria-pressed="${id === (dr.acct === undefined ? defaultAcct() : dr.acct)}">${esc(name)}</button>`).join("")}</div></div>`}
    <div class="q-row"><input class="field" id="q-note" placeholder="What was it? (optional)" value="${esc(dr.note)}" aria-label="Note"><input class="field" id="q-date" type="date" value="${esc(dr.d)}" aria-label="Date"></div>
    <button class="btn q-go" type="submit">${dr.type === "in" ? "Add income" : "Log it"}</button>
  </form>`;
}
function openSheet() {
  ui.draft.d = ui.draft.d || todayS();
  renderSheet(); const el = $("#sheet"); el.hidden = false; document.body.classList.add("sheet-on");
  setTimeout(() => { const a = $("#q-amt"); if (a) a.focus(); }, 60);
}
function closeSheet() { $("#sheet").hidden = true; document.body.classList.remove("sheet-on"); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
function addFromDraft() {
  const d = ui.draft, amt = Math.abs(pnum(d.amt));
  if (!amt) { toast("Enter an amount first."); return false; }
  const date = d.d || todayS(), k = monthKey(date);
  const tx = {id:rid(), d:date, amt:Math.round(amt*100)/100, cat:d.cat, note:d.note.trim(), type:d.type, acct: d.acct === undefined ? defaultAcct() : d.acct};
  const msg = applyToAccount(tx, 1);
  (S.months[k] = S.months[k] || []).push(tx);
  saveMonth(k); if (tx.applied) saveCore();
  toast(msg || `${d.type === "in" ? "Added" : "Logged"} ${money2(amt)}`);
  ui.draft.amt = ""; ui.draft.note = ""; ui.viewMonth = k;
  return true;
}

function arm(key) { if (ui.armed === key) return true; ui.armed = key; render(); return false; }

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) { if (ui.armed && !e.target.closest(".x")) { ui.armed = null; render(); } return; }
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case "clear-ex": clearExamples(); break;
    case "add-acct": { const n = {id:rid(), name:"New account", inst:"", kind:"cash", apy:0, balance:0, updated:null}; S.core.accounts.push(n); ui.editAcct = n.id; saveCore(); render(); break; }
    case "edit-acct": ui.editAcct = ui.editAcct === id ? null : id; ui.armed = null; render(); break;
    case "sheet-open": openSheet(); break;
    case "sheet-close": if (b.id === "sheet" && e.target !== b) break; closeSheet(); break;
    case "q-type": ui.draft.type = b.dataset.v; ui.draft.cat = b.dataset.v === "in" ? "pay" : defaultCat(); renderSheet(); break;
    case "q-cat": ui.draft.cat = id; document.querySelectorAll("#sheet .qcat:not(.qacct)").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.id === id))); break;
    case "q-acct": ui.draft.acct = id; document.querySelectorAll("#sheet .qacct").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.id === id))); break;
    case "goal-auto": { const g = S.core.goals.find(x => x.id === id); if (g) { if (g.autoMonths) { g.target = goalTarget(g); delete g.autoMonths; } else g.autoMonths = 3; saveCore(); render(); } break; }
    case "del-acct": if (arm("acct:"+id)) { S.core.accounts = S.core.accounts.filter(a => a.id !== id); S.core.goals.forEach(g => { if (g.link === id) g.link = ""; }); ui.armed = null; touchSnapshot(); saveCore(); render(); } break;
    case "m-prev": ui.viewMonth = shiftMonth(ui.viewMonth, -1); render(); break;
    case "m-next": if (ui.viewMonth < curMonth()) { ui.viewMonth = shiftMonth(ui.viewMonth, 1); render(); } break;
    case "type-out": case "type-in": ui.draft.type = act === "type-in" ? "in" : "out"; ui.draft.cat = act === "type-in" ? "pay" : defaultCat(); render(); break;
    case "del-tx": if (arm("tx:"+id)) { const k = ui.viewMonth; const tx = monthItems(k).find(t => t.id === id); if (tx && tx.applied) { applyToAccount(tx, -1); saveCore(); } S.months[k] = monthItems(k).filter(t => t.id !== id); ui.armed = null; saveMonth(k); render(); } break;
    case "bonus-m": { const m = Number(b.dataset.m), st = S.core.settings; st.bonusMonths = st.bonusMonths || []; st.bonusMonths = st.bonusMonths.includes(m) ? st.bonusMonths.filter(x => x !== m) : [...st.bonusMonths, m].sort((a,b)=>a-b); saveCore(); render(); break; }
    case "add-cat": S.core.cats.push({id:rid(), name:"New category", budget:0}); saveCore(); render(); break;
    case "del-cat": if (arm("cat:"+id)) { S.core.cats = S.core.cats.filter(c => c.id !== id); ui.armed = null; saveCore(); render(); } break;
    case "toggle-fixed-mode": ui.fixedMode = !ui.fixedMode; render(); break;
    case "toggle-fixed": { const c = S.core.cats.find(c => c.id === id); if (c) { c.fixed = !c.fixed; saveCore(); render(); } break; }
    case "del-goal": if (arm("goal:"+id)) { S.core.goals = S.core.goals.filter(g => g.id !== id); ui.armed = null; saveCore(); render(); } break;
    case "contrib": { const g = S.core.goals.find(g => g.id === id); const v = pnum($("#gc-"+id).value); if (g && v) { g.current = (Number(g.current)||0) + v; saveCore(); render(); toast(`Added ${money2(v)} to ${g.name}`); } break; }
    case "export": exportCSV(); break;
    case "read": runRead(); break;
    case "copy-data": { const code = encodeData();
      try { await navigator.clipboard.writeText(code); ui.codeShown = false; toast(IN_CLAUDE ? "Copied. Open the Ledger app → Future → Your data → Import." : "Data code copied"); render(); }
      catch (err) { ui.codeShown = true; render(); const t = $("#code-out"); if (t) { t.focus(); t.select(); } toast("Select the code below and copy it."); }
      break; }
    case "backup-file": {
      if (!IN_CLAUDE) { if (await saveLocalFile(`ledger-backup-${todayS()}.json`, JSON.stringify(S), "application/json")) toast("Backup ready"); break; }
      let dl = null; try { dl = await window.claude.use("downloads"); } catch (err) {}
      if (!dl) { toast("Use Copy my data code instead."); break; }
      try { await dl.save({filename:`ledger-backup-${todayS()}.json`, data: JSON.stringify(S)}); toast("Backup saved"); } catch (err) { if (err && err.code !== "declined") toast("Couldn't save the file here."); }
      break; }
    case "import-open": ui.importOpen = !ui.importOpen || ui.tab !== "future"; if (ui.tab !== "future") { ui.tab = "future"; } render(); { const el = $("#import"); if (el) el.scrollIntoView({block:"start"}); const ta = $("#code-in"); if (ta) ta.focus(); } break;
    case "import-go": { let d; try { d = decodeData(ui.importText); } catch (err) { toast(err.message && err.message.length < 80 ? err.message : "That code didn't work. Copy it again and paste the whole thing."); break; }
      if (arm("import")) importData(d); break; }
    case "read-stop": if (readCtl) readCtl.abort(); break;
  }
});

// Inline field edits (accounts, categories, goals, settings)
document.addEventListener("change", e => {
  const el = e.target;
  const acctRow = el.closest("[data-acct]"), catRow = el.closest("[data-cat]"), goalEl = el.closest("[data-goal]");
  // A number field left blank or mistyped keeps its old value instead of turning into $0.
  const NUMERIC = ["balance","apr","apy","pay","bonusPay","budget","target","autoMonths","monthly","ret","age","retireAge","realPrice","payNet","bonusNet","hourly","extraDebt"];
  const key = el.dataset.f || el.dataset.s;
  if (key && NUMERIC.includes(key) && !/\d/.test(el.value)) {
    const optional = ["bonusNet","hourly"].includes(key) && el.value.trim() === "";
    if (!optional) { toast("Kept the old number. Type a number to change it."); render(); return; }
  }
  if (acctRow && el.dataset.f) {
    const a = S.core.accounts.find(x => x.id === acctRow.dataset.acct); if (!a) return;
    const f = el.dataset.f;
    if (f === "balance") { a.balance = a.kind === "debt" ? Math.abs(pnum(el.value)) : pnum(el.value); a.updated = todayS(); touchSnapshot(); toast(`${a.name}: ${money2(a.balance)}`); }
    else if (f === "apr") { a.apr = Math.abs(pnum(el.value)); a.aprAssumed = false; }
    else if (f === "pay") { a.pay = Math.abs(pnum(el.value)); syncDebtCat(a); }
    else if (f === "apy" || f === "bonusPay") a[f] = Math.abs(pnum(el.value));
    else if (f === "kind") { a.kind = el.value; if (a.kind === "debt") { a.balance = Math.abs(Number(a.balance)||0); a.apr = a.apr || 0; a.pay = a.pay || 0; a.bonusPay = a.bonusPay || 0; } touchSnapshot(); }
    else a[f] = el.value;
    saveCore(); render(); return;
  }
  if (catRow && el.dataset.f) {
    const c = S.core.cats.find(x => x.id === catRow.dataset.cat); if (!c) return;
    if (el.dataset.f === "budget") { c.budget = r2(Math.abs(pnum(el.value))); syncDebtPay(c); } else c.name = el.value.trim() || c.name;
    saveCore(); render(); return;
  }
  if (goalEl && el.dataset.f) {
    const g = S.core.goals.find(x => x.id === goalEl.dataset.goal); if (!g) return;
    const f = el.dataset.f;
    if (f === "target") g.target = Math.abs(pnum(el.value));
    else if (f === "autoMonths") g.autoMonths = Math.max(0.5, Math.min(24, Math.abs(pnum(el.value))));
    else g[f] = el.value;
    saveCore(); render(); return;
  }
  if (el.dataset.s) {
    const st = S.core.settings, k = el.dataset.s;
    if (k === "autoBalances") st.autoBalances = el.value === "on";
    else if (k === "payFreq" || k === "payAnchor") st[k] = el.value;
    else if (k === "payDays") { const ds = el.value.split(/[^0-9]+/).map(Number).filter(n => n >= 1 && n <= 31); if (ds.length) st.payDays = [...new Set(ds)].sort((a,b)=>a-b); }
    else st[k] = pnum(el.value);
    if (k === "age") st.age = Math.max(14, Math.min(90, Math.round(st.age)));
    if (k === "retireAge") st.retireAge = Math.max(st.age + 1, Math.min(100, Math.round(st.retireAge)));
    if (k === "payFreq" || k === "payDays") S.core.accounts.forEach(a => { if (a.kind === "debt") syncDebtCat(a); });
    saveCore(); render(); return;
  }
  if (el.id === "d-cat") ui.draft.cat = el.value;
  if (el.id === "d-acct") ui.draft.acct = el.value;
  if (el.id === "import-file" && el.files && el.files[0]) { el.files[0].text().then(t => { ui.importText = t; ui.importOpen = true; render(); toast("File loaded. Tap Import."); }); }
  if (el.id === "d-date") ui.draft.d = el.value;
});
// sliders: live preview while dragging, save on release
document.addEventListener("input", e => {
  const el = e.target;
  if (el.type === "range" && el.dataset.s) {
    const k = el.dataset.s; S.core.settings[k] = Number(el.value);
    const tf = $("#s-" + k); if (tf) tf.value = k === "ret" ? el.value + "%" : money(Number(el.value));
    if (ui.tab === "debt") drawDebtDyn(); else drawFutureDyn();
    clearTimeout(window.__sv); window.__sv = setTimeout(saveCore, 700);
    return;
  }
  if (el.id === "code-in") { ui.importText = el.value; return; }
  if (el.id === "d-amt" || el.id === "q-amt") ui.draft.amt = el.value;
  if (el.id === "d-note" || el.id === "q-note") ui.draft.note = el.value;
  if (el.id === "q-date") ui.draft.d = el.value;
  if (el.id.startsWith("ng-")) ui.newGoal[el.id.slice(3)] = el.value;
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList && e.target.classList.contains("inline")) { e.preventDefault(); e.target.blur(); } });

document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "add-form") {
    if (!addFromDraft()) { $("#d-amt").focus(); return; }
    render(); const a = $("#d-amt"); if (a) a.focus();
  }
  if (e.target.id === "sheet-form") {
    if (!addFromDraft()) { $("#q-amt").focus(); return; }
    closeSheet(); render();
  }
  if (e.target.id === "goal-form") {
    const n = ui.newGoal; if (!n.name.trim() || !pnum(n.target)) { toast("Give the goal a name and a target."); return; }
    S.core.goals.push({id:rid(), name:n.name.trim(), target:pnum(n.target), current:0, due:n.due, link:$("#ng-link").value});
    ui.newGoal = {name:"", target:"", due:"", link:""};
    saveCore(); render(); toast("Goal added");
  }
});

/* ---------- export ---------- */
async function exportCSV() {
  const rows = [["date","type","category","note","amount"]];
  const catName = id => (S.core.cats.find(c => c.id === id) || INCOME_CATS.find(c => c.id === id) || {name:id}).name;
  Object.keys(S.months).sort().forEach(k => monthItems(k).slice().sort((a,b) => a.d < b.d ? -1 : 1).forEach(t => rows.push([t.d, t.type === "in" ? "income" : "expense", catName(t.cat), t.note, (t.type === "in" ? 1 : -1) * t.amt])));
  const csv = rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\n");
  let dl = null; try { dl = window.claude ? await window.claude.use("downloads") : null; } catch (e) {}
  if (!dl) { if (!IN_CLAUDE) { if (await saveLocalFile(`freedom-ledger-${todayS()}.csv`, csv, "text/csv")) toast("CSV ready"); } else toast("Downloads aren't available in this view."); return; }
  try { await dl.save({filename:`freedom-ledger-${todayS()}.csv`, data:csv}); toast("CSV saved"); }
  catch (e) { if (e && e.code !== "declined") toast("Couldn't save the file here."); }
}

/* ---------- Claude read ---------- */
let readCtl = null;
async function runRead() {
  let sample = null; try { sample = window.claude ? await window.claude.use("sample") : null; } catch (e) {}
  if (!sample) { ui.read.err = "Claude isn't available in this view."; render(); return; }
  const k = curMonth(), ms = monthStats(k), t = totals(), bt = budgetTotal();
  const data = {
    date: todayS(), age: S.core.settings.age, month: monthName(k), days_left_in_month: ms.daysLeft,
    net_worth: Math.round(t.net), cash: Math.round(t.cash), invested: Math.round(t.inv), debt: Math.round(t.debt),
    net_worth_history: S.core.snapshots.slice(-8).map(s => ({date:s.d, net:Math.round(s.t)})),
    accounts: S.core.accounts.map(a => ({name:(a.inst ? a.inst+" " : "")+a.name, type:a.kind, balance:Math.round(a.balance), apy:a.kind==="cash"?a.apy:undefined})),
    monthly_budget_total: bt,
    this_month: {income: Math.round(ms.inc), living_costs: Math.round(ms.spend), debt_payments: Math.round(ms.debt), to_savings: Math.round(ms.save), unassigned: Math.round(ms.left), flexible_left: Math.round(ms.flexLeft), per_day_allowance: Math.round(ms.perDay)},
    by_category: S.core.cats.map(c => ({category:c.name, kind:catKind(c), budget:c.budget, spent:Math.round((ms.byCat[c.id]||0)*100)/100, fixed:!!c.fixed})),
    pay: {schedule: S.core.settings.payFreq, days: S.core.settings.payDays, paycheck_net: S.core.settings.payNet, bonus_net: S.core.settings.bonusNet, bonus_months: (S.core.settings.bonusMonths||[]).map(m => MONTHS3[m-1])},
    goals: S.core.goals.map(g => ({goal:g.name, target:goalTarget(g), current:Math.round(goalCurrent(g)), due:g.due||null})),
    monthly_investing_plan: S.core.settings.monthly,
  };
  const dp = simulate("split", Number(S.core.settings.extraDebt)||0), da = simulate("rate", Number(S.core.settings.extraDebt)||0);
  if (dp.debts.length) data.debt_plan = {
    debts: S.core.accounts.filter(a => a.kind === "debt").map(a => ({name:a.name, balance:Math.round(a.balance), apr:a.apr, apr_is_placeholder:!!a.aprAssumed, per_paycheck:a.pay, extra_on_bonus_check:a.bonusPay})),
    current_plan: {debt_free: monYr(dp.free), interest_remaining: Math.round(dp.interest)},
    highest_rate_first: {debt_free: monYr(da.free), interest_remaining: Math.round(da.interest)},
  };
  const prompt = `You are reviewing one person's own personal finance snapshot from their budgeting app. They want a direct, evidence-based read, not encouragement.

Write exactly 5 bullets, each on its own line starting with "- ". Each bullet is one or two sentences and must cite a specific number from the data. Cover, in order:
1. Spending pace this month versus budget (name the category that matters most, over or under).
2. Cash flow: income versus living costs, debt payments and savings, and what's unassigned.
3. Debt: the debt-free date, interest still to pay, and what the data shows about payment order (if there is debt; if an APR is a placeholder, say the real rate is needed).
4. Cash cushion: months of living costs covered by cash, and whether cash is sitting in a low-APY account.
5. One concrete move for the next two weeks, sized to their actual paychecks.
Some debts may be owed to family at 0% interest; treat that relationship respectfully and don't moralize.
No headers, no intro, no sign-off, no disclaimers. Plain text only.

Data:
${JSON.stringify(data, null, 1)}`;
  readCtl = new AbortController();
  ui.read = {text:"", busy:true, err:"", at:""}; render();
  try {
    await sample(prompt, {signal: readCtl.signal, cache: false, onText: ({text}) => { ui.read.text = text; const o = $("#read-out"); if (o) { o.textContent = text; o.classList.remove("thinking"); } }});
    ui.read.at = new Date().toLocaleString("en-US", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  } catch (e) {
    ui.read.text = e && e.text ? e.text : ui.read.text;
    const c = e && e.code;
    ui.read.err = c === "cancelled" ? "" : c === "not_granted" || c === "sampling_disabled" ? "Claude isn't allowed for this page. You can turn it on from the page's permissions." : c === "rate_limited" ? "Too many requests right now. Try again in a bit." : "That didn't finish. Try again.";
  }
  ui.read.busy = false; readCtl = null; render();
}

/* ---------- boot ---------- */
const h = (location.hash || "").slice(1);
if (["overview","month","debt","goals","future"].includes(h)) ui.tab = h;
render();
Store.init();
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (ui.tab === "overview") nwChart($("#nw-chart")); if (ui.tab === "future") drawProj(); if (ui.tab === "debt") debtChart($("#debt-chart")); }, 150); });
})();
</script>
